# Chromaphore plus a client container on one compose network.
#
#   docker compose -f docker/compose-example.yml up --abort-on-container-exit --exit-code-from client
#
# The client reaches the browser by its service name: http://chromaphore:9222.
# Puppeteer connects the same way: puppeteer.connect({ browserURL: "http://chromaphore:9222" }).
services:
  chromaphore:
    image: ghcr.io/nodriver-project/chromaphore:latest
    # Other containers need no published port. To attach from the host as well:
    # ports:
    #   - "127.0.0.1:9222:9222"

  client:
    image: node:24-slim
    depends_on:
      chromaphore:
        condition: service_healthy
    working_dir: /tmp
    command:
      - sh
      - -c
      - |
        npm i --silent --no-fund --no-audit playwright-core@1.65.1 >/dev/null && node -e '
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.connectOverCDP("http://chromaphore:9222");
            const page = await browser.contexts()[0].newPage();
            await page.goto("https://example.com");
            console.log("title:", await page.title());
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });'
