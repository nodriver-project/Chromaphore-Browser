# NPM dependencies of the chromium-bidi mapper (the WebDriver BiDi implementation
# that ships inside chromedriver). New in 156: the Chromium tree gets them as a
# GCS download gated on non_git_source, which clone.py sets to False, so the clone
# leaves third_party/chromium-bidi/node_modules absent and ninja stops at once on
# node_modules/mitt/index.d.ts (an input of chromium-bidi/src:utils_sources).
# The object name (used as version here) and the sha256 are those of the DEPS
# entry src/third_party/chromium-bidi/node_modules and change with every release:
# copy both from DEPS at each upgrade. The archive has no leading directory.
[chromium-bidi-node-modules]
version = 028c7baf9de02f6ae103b1911ab13d1aeb48f0ddd8fa702f9c150cdaf8cb5f5b
url = https://storage.googleapis.com/chromium-nodejs/chromium-bidi/%(version)s
download_filename = chromium-bidi-node_modules-%(version)s.tar.gz
sha256 = 028c7baf9de02f6ae103b1911ab13d1aeb48f0ddd8fa702f9c150cdaf8cb5f5b
output_path = third_party/chromium-bidi/node_modules
